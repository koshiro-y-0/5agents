# 5agents on Hugging Face Spaces — supervisord 設定
#
# 1 コンテナ内で 3 つのプロセスを並走させる:
#   1. uvicorn    : FastAPI (LINE webhook) を 127.0.0.1:8080 で起動
#   2. streamlit  : ダッシュボード UI を 127.0.0.1:8501 で起動
#   3. nginx      : 7860 で受けて 1/2 に振り分け
#
# どれか 1 つでも落ちると autorestart が走る (最大 3 回試行)。

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
loglevel=info

# HF Spaces のシステム socket と衝突しないように /tmp に逃がす
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ─────────── FastAPI (LINE webhook) ───────────
[program:fastapi]
command=/app/.venv/bin/uvicorn src.line.webhook:app --host 127.0.0.1 --port 8080 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/tmp/fastapi.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/tmp/fastapi.error.log
stderr_logfile_maxbytes=10MB
# HF Secrets で渡された環境変数を継承
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app"

# ─────────── Streamlit (UI) ───────────
[program:streamlit]
command=/app/.venv/bin/streamlit run src/app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/tmp/streamlit.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/tmp/streamlit.error.log
stderr_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app",STREAMLIT_SERVER_HEADLESS="true"

# ─────────── nginx (リバプロ) ───────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/tmp/nginx.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/tmp/nginx.error.log
stderr_logfile_maxbytes=10MB
# nginx は uvicorn/streamlit より後に起動 (上流が立ち上がってから振る)
priority=200
