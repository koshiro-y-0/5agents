# 5agents on Hugging Face Spaces — リバプロ設定
#
# HF Spaces は単一の external port (デフォルト 7860) でしか受けない。
# このコンテナの中では:
#   - FastAPI (uvicorn) が 127.0.0.1:8080
#   - Streamlit       が 127.0.0.1:8501
# で listen していて、nginx が 7860 で受けて振り分ける。
#
# 振り分けルール:
#   /line/*  /health   → FastAPI :8080  (LINE webhook + health-check)
#   それ以外           → Streamlit :8501 (UI / ダッシュボード)
#
# Streamlit は WebSocket (/_stcore/stream) を使うため、Upgrade ヘッダを通す。

# HF Spaces コンテナ内では非 root で動くため、PID と一時ファイルは /tmp に
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

# nginx 自体のワーカー数は単純に CPU 数で十分
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # nginx の各種一時ファイルは /tmp に逃がす (HF Spaces は /var が read-only な場合あり)
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    access_log            /tmp/nginx-access.log;

    # MIME types はデフォルトのままで十分 (Streamlit/uvicorn が Content-Type 設定)
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # LangGraph パイプライン全体は 1〜2 分かかるので long timeout
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 30s;

    # アップストリーム
    upstream fastapi_upstream {
        server 127.0.0.1:8080;
    }
    upstream streamlit_upstream {
        server 127.0.0.1:8501;
    }

    server {
        listen 7860 default_server;
        listen [::]:7860 default_server;

        # 大きめのボディを許可 (LINE webhook 自体は小さいが、念のため)
        client_max_body_size 4M;

        # ─────────── LINE webhook & ヘルスチェック ───────────
        location /line/ {
            proxy_pass         http://fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Line-Signature  $http_x_line_signature;
        }

        location = /health {
            proxy_pass         http://fastapi_upstream/health;
            proxy_set_header   Host $host;
        }

        # ─────────── それ以外は Streamlit に渡す ───────────
        # Streamlit は WebSocket (HTTP Upgrade) が必須
        location / {
            proxy_pass         http://streamlit_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # WebSocket 用のサブパス (念のため明示)
        location /_stcore/stream {
            proxy_pass         http://streamlit_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
